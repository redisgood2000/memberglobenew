name: Build Native Member Globe Android APK

on:
  workflow_dispatch:
  push:
    branches: [native-android]
    paths:
      - "native-android/**"
      - ".github/workflows/build-native-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      # Preserve the runner's debug signing key between builds so the APK
      # signing certificate fingerprint stays stable for Google OAuth setup.
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: member-globe-native-debug-keystore-v1
      - name: Build debug APK
        working-directory: native-android
        run: gradle --no-daemon assembleDebug
      - name: Print APK signing certificate SHA-1
        run: |
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | grep -E 'SHA1:|SHA-1:'
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: member-globe-native-debug-apk
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
